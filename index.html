
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusFlow - Daily Task Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">YOUR PERSONAL WORKSPACE</p>
        <h1>FocusFlow</h1>
        <p class="subtitle">Small steps. Real progress.</p>
      </div>
      <div class="logo">F</div>
    </header>

    <section class="stats" aria-label="Task statistics">
      <div class="stat-card">
        <span>Total tasks</span>
        <strong id="total-count">0</strong>
      </div>
      <div class="stat-card">
        <span>Completed</span>
        <strong id="completed-count">0</strong>
      </div>
      <div class="stat-card">
        <span>Remaining</span>
        <strong id="remaining-count">0</strong>
      </div>
    </section>

    <section class="task-panel">
      <h2>Today's tasks</h2>
      <form id="task-form">
        <label class="sr-only" for="task-input">New task</label>
        <input
          id="task-input"
          type="text"
          placeholder="What do you need to do?"
          maxlength="120"
          required
        >
        <button type="submit">+ Add task</button>
      </form>

      <div class="filters" aria-label="Filter tasks">
        <button type="button" class="filter active" data-filter="all">All</button>
        <button type="button" class="filter" data-filter="active">Active</button>
        <button type="button" class="filter" data-filter="completed">Completed</button>
      </div>

      <ul id="task-list" class="task-list"></ul>
      <p id="empty-message" class="empty-message">
        No tasks yet. Add your first task above!
      </p>
      <p id="task-summary" class="task-summary" aria-live="polite"></p>
    </section>

    <footer>
      <p>Your tasks are saved in this browser.</p>
    </footer>
  </main>
</body>
</html>
